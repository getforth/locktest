<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Forth test page</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #1b1f3a; color: #f6efe2;
    font: 17px/1.5 -apple-system, system-ui, sans-serif;
    padding: 0 28px; box-sizing: border-box; text-align: center;
  }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { margin: 0; max-width: 22em; color: #d9d3e6; }
  .checking main { visibility: hidden; }
</style>
<script>
  // Safari can load this page before Forth's extension has woken up. Load it once more
  // before saying the lock failed, so the extension gets a second look at the address.
  (function () {
    try {
      var last = Number(sessionStorage.getItem("forth-locktest-reload")) || 0;
      if (Date.now() - last < 10000) return;
      sessionStorage.setItem("forth-locktest-reload", String(Date.now()));
      document.documentElement.className = "checking";
      setTimeout(function () { location.reload(); }, 1200);
    } catch (e) {}
  })();
</script>
</head>
<body>
<main>
<h1>Forth test page</h1>
<p>If you can read this, your apps didn't lock. Go back to Forth and try again.</p>
</main>
</body>
</html>
